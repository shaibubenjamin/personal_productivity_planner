      2026-09-07). Reality check: CEFR guidance puts A1-to-C2 at roughly
      1000-1200 study hours; in ~12 months that is ~2.7-3.3 hours every single
      day, which is hard to reconcile with Career at 50% of attention and 9
      critical capabilities in flight. Milestones below sequence the levels
      across the window on a front-loaded, intensive-but-not-fantasy pace;
      whether C2 lands exactly by the birthday or slips to B2/C1 with C2
      shortly after is a real risk to flag in reviews, not a promise.
    why_it_matters: "Owner-stated long-term development objective (spec Domain 8)."
    strategic_importance: 6
    target_date: "2027-09-17"
    baseline: "A1"
    target: "C2"
    status: in_progress
    progress: 0
    confidence: LOW
    next_action: "Milestones: A2 by 2026-11-15, B1 by 2027-02-15, B2 by 2027-05-31, C1 by 2027-08-15, C2 push in the final weeks. Daily habit stack: spaced-repetition vocab (~15-20min), grammar/structured course (~20-30min), listening immersion (~20-30min), speaking practice 2-3x/week once past A2, short daily French journaling. See chat 2026-09-07 for the full strategy."
