# Automation categories (spec Section 29). This file is the enforcement point —
# engine code must check this, not hard-code approval behavior.

category_a_automatic:
  - read_calendar
  - analyze_calendar
  - read_emails
  - classify_emails
  - analyze_goals
  - generate_reports
  - search_relevant_news
  - calculate_priority
  - identify_duplicates
  - generate_recommendations

category_b_auto_after_confidence:
  enabled: false   # stays false until trust_graduation criteria (below) are met
  actions:
    - archive_obvious_newsletters
    - apply_labels
    - create_low_risk_reminders
    - generate_routine_calendar_blocks
    - organize_low_risk_documents
  execution_mode: batched_morning_approval   # never silent, even once enabled

category_c_owner_approved_exceptions:
  # Standing, narrowly-scoped exceptions the owner explicitly approved on
  # 2026-09-07 - NOT a general bypass of category C. Each is self-addressed
  # / self-only, recurring, and was approved as a class of action, not
  # rubber-stamped case by case. Revoke by removing the entry here.
  - action: send_weekly_review_email
    scope: "To benjaminshaibu01@gmail.com ONLY - never any other recipient."
    routine: "PEOS Weekly Review Email (trig_017i8867KBQ9xkcBUaxd6JLv)"
  - action: create_recurring_self_calendar_events
    scope: "Self-only events (no other attendees) for study/reflection/review blocks the owner explicitly requested."
    note: "One-time setup tasks, not the daily/weekly unattended routines - each new recurring block still needs an explicit ask."

category_c_human_approval_required:
  actions:
    - delete_emails
    - delete_drive_files
    - send_important_emails
    - reply_to_sensitive_messages
    - move_important_meetings
    - cancel_meetings
    - major_financial_actions
    - relationship_sensitive_communications
    - external_commitments
    - irreversible_actions
  execution_mode: per_action_approval   # always, no batching

trust_graduation:
  min_consecutive_days_clean: 14
  criteria:
    - zero_safety_test_failures
    - zero_rejected_category_a_outputs
